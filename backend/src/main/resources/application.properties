spring.application.name=matriz
spring.jackson.deserialization.use-big-decimal-for-floats=true
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/matriz}
spring.datasource.username=${DB_USER:matriz}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jdbc.template.query-timeout=3
spring.sql.init.mode=never
server.error.include-message=never
server.error.include-stacktrace=never

# Flyway gere o esquema sem apagar dados existentes.
spring.flyway.enabled=true
matriz.demo-seed.enabled=${DEMO_SEED_ENABLED:false}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Optional delegated personal Microsoft account connection (never Matriz login).
matriz.microsoft.enabled=${MICROSOFT_CONNECTION_ENABLED:false}
matriz.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
matriz.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
matriz.microsoft.redirect-uri=${MICROSOFT_REDIRECT_URI:}

