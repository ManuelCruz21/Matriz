# Ambiente local reproduzível. Não publicar a porta 8080 diretamente.
services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: matriz
      POSTGRES_USER: matriz
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD no ficheiro .env local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matriz -d matriz"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://db:5432/matriz
      DB_USER: matriz
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD no ficheiro .env local}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_MANAGER_PASSWORD: ${DEMO_MANAGER_PASSWORD:-}
      DEMO_MEMBER_PASSWORD: ${DEMO_MEMBER_PASSWORD:-}
      MATRIZ_SECURITY_ADMIN_EMAIL: ${MATRIZ_SECURITY_ADMIN_EMAIL:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--noproxy", "*", "--connect-timeout", "2", "--max-time", "5", "--output", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 6s
      start_period: 40s
      retries: 10
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
