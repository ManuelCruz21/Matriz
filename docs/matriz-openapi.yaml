x-matriz-acesso-aprovada:
  estado: D3 aprovada e preservada; contrato documentado, fecho final humano P1 pendente.
  ambito: Papéis por participação direta no projeto; autorização no servidor também para acesso direto por identificador.
    Gestor não precisa de ser responsável por tarefa.
  consulta-projeto-tarefas-comentarios-elegiveis-historico-painel:
    gestor: Permitido no seu projeto.
    membro: Permitido no seu projeto, sem exigir atribuição como responsável.
    nao-participante: Sem acesso; 404 para recurso identificado. Listagens e painel omitem projetos inacessíveis.
  editar-eliminar-projeto:
    gestor: Permitido no seu projeto.
    membro: Proibido (403 em recurso acessível).
  criar-tarefa:
    gestor: Permitido no seu projeto; pode definir responsáveis elegíveis.
    membro: Permitido no seu projeto com responsibleUserIds omitido ou []; array não vazio devolve 403
      atomicamente, sem tarefa nem atribuições, incluindo autoatribuição. Autoria não confere edição.
  editar-tarefa-estado-prioridade:
    gestor: Permitido para qualquer tarefa do seu projeto, mesmo sem ser responsável.
    membro: Permitido apenas se a tarefa lhe estiver atribuída; caso contrário, 403 em recurso acessível. Prioridade
      segue edição da tarefa.
  eliminar-tarefa-gerir-responsaveis:
    gestor: Permitido para qualquer tarefa do seu projeto, mesmo sem ser responsável.
    membro: Proibido (403 em recurso acessível), incluindo atribuições iniciais via CreateTask.
  comentar:
    gestor: Permitido nas tarefas do seu projeto.
    membro: Permitido nas tarefas do seu projeto, sem exigir atribuição.
  criar-projeto: Criador autenticado associado automaticamente como gestor na mesma transação; projeto inicialmente
    privado sem outros membros.
  respostas: 401 sem autenticação; 403 sem permissão sobre recurso acessível; 404 para inexistente ou inacessível,
    sem revelar existência a não participante.
x-pontos-aprovados:
  estado: Decisões aprovadas complementares a D1–D10, integralmente preservadas; P1 apenas documental, fecho final pendente.
  ponto-1-ordenacao:
    projetos: id DESC, incluindo projetos no painel.
    tarefas: createdAt DESC, id DESC; createdAt obrigatório no schema Task, gerado pelo servidor.
    comentarios: createdAt UTC ASC, id ASC.
    historico: changedAt UTC ASC, id ASC.
    elegiveis: user.name case-insensitive ASC, user.id ASC.
  ponto-2-pesquisa: Substring literal no nome do projeto após trim da pesquisa; case-insensitive e accent-sensitive.
    Omitida ou vazia após trim não filtra. Percentagem (%) e underscore (_) são literais, não wildcards.
  ponto-3-descricoes: Na criação, descrição omitida ou null significa ausência; no PATCH, omitida mantém e null remove.
    Texto é aparado antes de validar comprimentos; vazio ou apenas espaços é rejeitado. Respostas incluem description null
    quando ausente. Aplicável a projetos e tarefas, preservando os limites D8.
  ponto-4-create-task: Membro pode omitir responsibleUserIds ou enviar []; array não vazio devolve 403 em projeto acessível
    atomicamente, sem tarefa ou atribuições, incluindo tentativa de autoatribuição. Gestor pode atribuir apenas elegíveis,
    validando o conjunto integral. Preservar D3/D5/D6/D8 e TODO/MEDIUM iniciais.
  ponto-5-listas: Todas as listagens do MVP sem paginação, incluindo painel, comentários, histórico e elegíveis.
    items contém o conjunto completo autorizado e filtrado; totalItems corresponde a esse conjunto. Preservar contagens D9.
  ponto-6-stack-topologia:
    familias: Java 21 LTS; Spring Boot 3.5.x; React 19.x; PostgreSQL 17.x; monólito modular D2.
    verificacao: Verificar suporte e compatibilidade ANTES da implementação; versões exatas a fixar no futuro.
      Sem consulta de versões pela rede nesta tarefa; suporte e compatibilidade não confirmados.
    topologia: Frontend e API na mesma origem; HTTPS em produção; proxy em desenvolvimento.
      Sem CORS arbitrário com credenciais. Origens específicas de implantação são configuração futura, não decisão MVP pendente.
  ponto-7-bootstrap-csrf:
    estado: Aprovado condicionalmente à consistência com D1–D10 e pontos 1–6; fecho final P1 ainda pendente.
    convencoes: Cookie JSESSIONID e cabeçalho X-CSRF-TOKEN; rotas e DTOs documentados neste contrato não são falta de decisão.
    fluxo: GET /auth/csrf antes do login associa token à sessão anónima e emite cookie se necessário; não autentica.
      Browser conserva cookie HttpOnly e envia cookie e token no login; renovar sessão no login e obter novo token depois
      do login e do logout. Resposta CSRF com Cache-Control no-store. Preservar integralmente D4.
