        antes do login, separado do cookie HttpOnly conservado pelo browser. Enviar o token em X-CSRF-TOKEN e o
        cookie no login; renovar sessão e obter novo token após sucesso. Não é credencial de autenticação.'
x-decisoes-aprovadas:
  D1: 'MVP completo Ficha 03: autenticação, CRUD projetos/tarefas, vários responsáveis, comentários, pesquisa, filtros
    e painel; histórico conforme D10. Registo público e recuperação de palavra-passe não integram este contrato.'
  D2: Java com Spring Boot, React e PostgreSQL; monólito modular.
  D3: Matriz gestor/membro por projeto aprovada em x-matriz-acesso-aprovada. Gestor edita/elimina projeto, cria/edita/altera
    estado e prioridade de qualquer tarefa do projeto, elimina tarefas e gere responsáveis. Membro cria tarefas;
    só edita/altera estado e prioridade de tarefas atribuídas a si. Ambos consultam e comentam, incluindo consulta
    de elegíveis e histórico. Gestor não precisa de ser responsável. 401 sem autenticação; 403 para operação proibida
    sobre recurso acessível; 404 para inexistente ou inacessível, sem revelar existência a não participante. Criação
    associa automaticamente criador como gestor na mesma transação; projeto inicialmente privado, sem outros membros.
    A gestão exclusiva de responsáveis pelo gestor aplica-se também a CreateTask; membro não pode autoatribuir-se.
  D4: 'D4 aprovada: sessões Spring Security com inatividade máxima de 30 minutos e duração absoluta máxima de 8
    horas; cookie HttpOnly, SameSite=Lax e Secure em HTTPS; CSRF nas operações mutáveis, inclusive login/logout;
    rotação do identificador de sessão no login e invalidação da sessão no logout.'
  D5: Cada tarefa admite zero ou mais responsáveis elegíveis, sem duplicação.
  D6: Participação direta no projeto, preparada por seed. Elegibilidade exige pertença direta ao projeto, não pertença
    a equipa.
  D7: Eliminação definitiva e transacional de projeto/tarefa e dependentes, sem órfãos; falha implica rollback integral.
  D8: Trim e rejeição de texto vazio quando fornecido; nome projeto 3–100, descrição opcional até 1000; título tarefa
    3–150, descrição opcional até 2000; comentário 1–2000. Estados TODO/IN_PROGRESS/DONE, prioridades LOW/MEDIUM/HIGH;
    valores iniciais TODO/MEDIUM.
  D9: Painel global sobre projetos acessíveis. Contagens por estado de cada projeto respeitam prioridade e ignoram
    filtro de estado; total da listagem de tarefas respeita ambos. Pesquisa de projetos pelo nome sem distinção
    de maiúsculas/minúsculas; ordenação estável; contagens sobre todo o conjunto relevante, sem paginação.
  D10: Histórico apenas de alterações efetivas de estado, prioridade e conjunto de responsáveis; autor autenticado,
    instante UTC, valor anterior e novo. Sem evento para no-op, criação, textos ou comentários. Apagar com tarefa/projeto.
