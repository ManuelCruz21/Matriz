name: CI Matriz
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Testes backend e PostgreSQL isolado
        working-directory: backend
        run: mvn -B -ntp -Pintegration verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Testes frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências frontend
        working-directory: frontend
        run: npm ci
      - name: Instalar Chromium e dependências Linux
        working-directory: backend
        run: mvn -B -ntp -Pe2e test-compile exec:java -Dexec.args="install --with-deps chromium"
      - name: Browser E2E com PostgreSQL isolado
        working-directory: backend
        run: mvn -B -ntp -Pe2e verify
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker backend
        run: docker build -t matriz-backend:ci ./backend
      - name: Build Docker frontend
        run: docker build -t matriz-frontend:ci ./frontend
